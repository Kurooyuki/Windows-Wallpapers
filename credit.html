<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #000;
    color: #fff;
    text-align: center;
    font-family: sans-serif;
    overflow: hidden; /* Mencegah scroll bar muncul */
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
  }

  .credits-container {
    position: absolute;
    width: 90%; /* Memberi sedikit ruang di kiri/kanan */
    white-space: pre-line;
    /* Animasi: 15 detik, linear, dan diulang terus menerus */
    animation: scroll 15s linear infinite;
  }

  @keyframes scroll {
    0% { transform: translateY(100vh); }
    100% { transform: translateY(-100%); }
  }

  h1 { color: #aaa; font-size: 8vw; }
  p { margin: 20px 0; font-size: 5vw; line-height: 1.6; }

  /* Pengaturan untuk komputer agar teks tidak terlalu lebar/besar */
  @media (min-width: 768px) {
    h1 { font-size: 40px; }
    p { font-size: 20px; }
  }
</style>
</head>
<body>

  <div class="credits-container">
    <h1>CREDITS</h1>
    <p>Microsoft Corporation</p>
    <p><b>Six N. Fiv
Bradley G. Munkowitz
Michael Shainblum
Alistair Campbell
Matt Anderson
Corey Rich
Grant Thomas
Klaus Haapaniemi
Charles O'Rear</b></p>
    
    <p>WallpaperHub
Reddit
DeviantArt
<b>Wallpaper Cave
Wallpaper Flare
Archive.org</b></p>
    
    <p>Special Thanks To Github</p>
  </div>

</body>
</html>
