<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #000;
    color: #fff;
    text-align: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden; /* Mencegah scrollbar */
  }

  .credits-container {
    position: absolute;
    width: 90%;
    max-width: 600px;
    white-space: pre-line;
    /* Durasi 30 detik agar sangat slow dan bisa dibaca jelas */
    animation: scroll 30s linear infinite;
    padding-top: 100vh; /* Mulai dari bawah layar */
  }

  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-200vh); }
  }

  h1 { color: #aaa; font-size: 2rem; margin-bottom: 20px; }
  p { margin: 15px 0; font-size: 1.2rem; line-height: 1.8; }
  b { color: #fff; display: block; margin-top: 5px; }

  /* Agar font tetap proporsional di semua perangkat */
  @media (max-width: 600px) {
    h1 { font-size: 1.5rem; }
    p { font-size: 1rem; }
  }
</style>
</head>
<body>

  <div class="credits-container">
    <h1>CREDITS</h1>
    <p>Microsoft Corporation</p>
    <p><b>Six N. Fiv
Bradley G. Munkowitz
Michael Shainblum
Alistair Campbell
Matt Anderson
Corey Rich
Grant Thomas
Klaus Haapaniemi
Charles O'Rear</b></p>
    
    <p>WallpaperHub
Reddit
DeviantArt
<b>Wallpaper Cave
Wallpaper Flare
Archive.org</b></p>
    
    <p>Special Thanks To Github</p>
  </div>

</body>
</html>
