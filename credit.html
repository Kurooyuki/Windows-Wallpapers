<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #000;
    color: #fff;
    text-align: center;
    font-family: sans-serif;
    overflow: hidden;
    margin: 0;
  }

  .credits-container {
    position: absolute;
    width: 100%;
    /* Menjaga format teks sesuai yang diketik (Enter terbaca) */
    white-space: pre-line; 
    animation: scroll 12s linear forwards;
  }

  @keyframes scroll {
    0% { transform: translateY(100vh); }
    100% { transform: translateY(-100%); }
  }

  h1 { color: #aaa; margin-top: 50vh; }
  p { margin: 15px 0; font-size: 20px; line-height: 1.5; }
</style>
</head>
