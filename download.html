<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Wallpaper Archive - Download</title>
    <style>
        :root {
            --win-blue: #0078d4;
            --win-dark: #1e1e1e;
            --bg-light: #f3f3f3;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HERO CENTERED CONTENT --- */
        .hero-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: radial-gradient(circle at center, #005a9e 0%, #002050 100%);
            color: white;
            text-align: center;
        }

        .hero-content {
            max-width: 650px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hero-content h1 {
            margin: 0 0 15px 0;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .hero-content p {
            margin: 0 0 35px 0;
            font-size: 1.15rem;
            opacity: 0.9;
            line-height: 1.5;
        }

        /* --- BUTTONS --- */
        .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #white;
            background-color: white;
            color: var(--win-blue);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary:hover {
            background-color: #f0f0f0;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .btn-outline {
            background-color: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        /* --- FOOTER & DISCLAIMER --- */
        footer {
            background-color: #1a1a1a;
            color: #aaaaaa;
            text-align: center;
            padding: 35px 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            border-top: 1px solid #2a2a2a;
        }

        .disclaimer-box {
            max-width: 850px;
            margin: 0 auto;
            padding: 15px 20px;
            border-left: 4px solid #ffb900;
            background-color: #252525;
            text-align: left;
            border-radius: 0 8px 8px 0;
        }

        .disclaimer-box strong {
            color: #ffffff;
            display: block;
            margin-bottom: 5px;
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 600px) {
            .hero-content h1 { font-size: 2rem; }
            .hero-content p { font-size: 1rem; }
            .cta-buttons { flex-direction: column; gap: 12px; }
            .btn { width: 100%; text-align: center; }
            .disclaimer-box { text-align: center; border-left: none; border-top: 4px solid #ffb900; border-radius: 8px; }
        }
    </style>
</head>

            <div class="cta-buttons">
                <a href="index.html" class="btn btn-primary">Back To Homepage</a>
        </div>
     </div>
    </div>

    </footer>

</body>
